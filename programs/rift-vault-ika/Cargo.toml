[package]
name = "rift-vault-ika"
version = "0.1.0"
description = "RIFT operator vault custody via Ika dWallet 2PC-MPC"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rift_vault_ika"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32"
anchor-spl = "0.32"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
